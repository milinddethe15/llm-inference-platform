apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-inference-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/milinddethe15/llm-inference-platform.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
