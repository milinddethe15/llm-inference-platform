apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Allow HTTPRoutes from any namespace to attach to this Gateway
      allowedRoutes:
        namespaces:
          from: All
