apiVersion: v2
name: llm-platform
description: >
  Production-grade LLM inference platform umbrella chart.
  Bundles KServe (CRDs, controller, runtime configs, and LLMInferenceService
  support) with the llm-d model-service chart so both work seamlessly together
  out of the box.

  Prerequisites (install separately before this chart):
    - cert-manager >= v1.15.0
    - Gateway API CRDs (sigs.k8s.io/gateway-api)
    - A Gateway API implementation (kgateway, Istio, etc.)

type: application
version: 0.1.0
appVersion: "0.1.0"

home: https://github.com/milinddethe15/llm-platform
sources:
  - https://github.com/kserve/kserve
  - https://github.com/llm-d-incubation/llm-d-modelservice
  - https://github.com/llm-d/llm-d

annotations:
  # Signals to ArgoCD / Flux to install CRD charts in a prior sync wave.
  # When using ArgoCD, annotate the Application with:
  #   argocd.argoproj.io/sync-wave: "-2"   # kserve-crd, kserve-llmisvc-crd
  #   argocd.argoproj.io/sync-wave: "-1"   # kserve-resources, kserve-runtime-configs, kserve-llmisvc-resources
  #   argocd.argoproj.io/sync-wave: "0"    # llm-d-modelservice
  category: ai-infrastructure

dependencies:
  # ─────────────────────────────────────────────────────────────────────────────
  # Wave -2 · CRDs  (must be fully established before controllers start)
  # ─────────────────────────────────────────────────────────────────────────────

  # Core KServe CRDs: InferenceService, ServingRuntime, ClusterServingRuntime, etc.
  - name: kserve-crd
    version: "v0.19.0"
    repository: "oci://ghcr.io/kserve/charts"
    alias: kserve-crd
    tags:
      - kserve
      - crds

  # LLMInferenceService CRD — the KServe-native resource for generative AI / llm-d.
  # Required to create LLMInferenceService objects that drive llm-d model pods.
  - name: kserve-llmisvc-crd
    version: "v0.19.0"
    repository: "oci://ghcr.io/kserve/charts"
    alias: kserve-llmisvc-crd
    tags:
      - kserve
      - crds
      - llm-d

  # ─────────────────────────────────────────────────────────────────────────────
  # Wave -1 · Controllers + configs  (depend on CRDs being installed)
  # ─────────────────────────────────────────────────────────────────────────────

  # KServe controller, admission webhooks, and RBAC.
  - name: kserve-resources
    version: "v0.19.0"
    repository: "oci://ghcr.io/kserve/charts"
    alias: kserve-resources
    tags:
      - kserve

  # Pre-built ClusterServingRuntimes (vLLM, HuggingFace TGI, Triton, MLServer …).
  # MANDATORY since KServe v0.18 — omitting this causes "no runtime found" errors.
  - name: kserve-runtime-configs
    version: "v0.19.0"
    repository: "oci://ghcr.io/kserve/charts"
    alias: kserve-runtime-configs
    tags:
      - kserve

  # LLMInferenceService controller — reconciles LLMInferenceService objects,
  # wires the llm-d scheduler/router, and manages KV-cache aware routing.
  - name: kserve-llmisvc-resources
    version: "v0.19.0"
    repository: "oci://ghcr.io/kserve/charts"
    alias: kserve-llmisvc-resources
    tags:
      - kserve
      - llm-d

  # ─────────────────────────────────────────────────────────────────────────────
  # Wave 0 · llm-d model service
  # ─────────────────────────────────────────────────────────────────────────────

  # llm-d model service: deploys the vLLM-backed decode/prefill pods,
  # InferencePool, and Endpoint Picker (EPP) sidecar for KV-cache aware routing.
  - name: llm-d-modelservice
    version: "0.4.5"
    repository: "https://llm-d-incubation.github.io/llm-d-modelservice/"
    alias: llmd
    tags:
      - llm-d
