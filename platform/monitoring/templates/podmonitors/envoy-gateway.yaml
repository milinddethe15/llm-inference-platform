apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-gateway
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy

  namespaceSelector:
    matchNames:
      - envoy-gateway-system

  podMetricsEndpoints:
    - path: /stats/prometheus
      interval: 15s
      port: metrics
