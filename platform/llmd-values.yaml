# =============================================================================
# llm-d model-service values for the llm-platform umbrella chart
#
# These values are namespaced under the `llmd` alias (matching the `alias`
# field in Chart.yaml).
#
# All keys map directly to the llm-d-modelservice chart's values.yaml schema.
# Reference: https://github.com/llm-d-incubation/llm-d-modelservice
# =============================================================================

llmd:
  # ── Sub-chart enable guard ────────────────────────────────────────────────
  # Set false to skip llm-d entirely (e.g., KServe-only installs).
  enabled: true

  # ── Model identity & source ───────────────────────────────────────────────
  modelArtifacts:
    # The model name used in OpenAI-compatible requests (model parameter)
    name: "ibm-granite/granite-3.3-8b-instruct"

    # Pod labels — must match the InferencePool selector.
    # The chart also adds llm-d.ai/role=decode|prefill automatically.
    labels:
      llm-d.ai/inference-serving: "true"

    # Model URI. Supported schemes:
    #   hf://org/model   — fetch from Hugging Face Hub
    #   pvc://pvc-name/path — read from an existing PVC
    uri: "hf://ibm-granite/granite-3.3-8b-instruct"

    # PVC size allocated for the model cache volume
    size: 50Gi

    # Name of the Kubernetes Secret that contains HF_TOKEN (or S3 creds).
    # Create it with:
    #   kubectl create secret generic hf-token \
    #     --from-literal=HF_TOKEN=<token> -n <namespace>
    authSecretName: "hf-token"

    # Where the model volume is mounted inside each container
    mountPath: /model-cache

    # Read-only mount (set false if the container writes the HF cache)
    readOnly: true

  # ── Multi-node / LeaderWorkerSet ──────────────────────────────────────────
  # Boolean. When true, a LeaderWorkerSet is used instead of a Deployment.
  # Requires the LWS controller installed in the cluster.
  multinode: false

  # ── Accelerator ───────────────────────────────────────────────────────────
  # Supported types: nvidia, amd, intel-i915, intel-xe, intel-gaudi,
  #                  google, cpu, rebellions-atom
  accelerator:
    type: nvidia
    # Set true to use Dynamic Resource Allocation instead of device-plugin limits
    dra: false

  # ── Routing ───────────────────────────────────────────────────────────────
  routing:
    # Port that the inference engine (vLLM) listens on
    servicePort: 8000

    # Routing sidecar (llm-d-routing-sidecar) — enables KV-cache-aware
    # request dispatch between prefill and decode pods.
    proxy:
      enabled: true
      image: ghcr.io/llm-d/llm-d-routing-sidecar:latest
      imagePullPolicy: Always
      # vLLM listens on this port when the sidecar is active
      targetPort: 8200
      connector: nixlv2
      secure: false
      zapEncoder: json
      zapLogLevel: info

  # ── Decode pods ───────────────────────────────────────────────────────────
  decode:
    create: true
    replicas: 1

    autoscaling:
      enabled: false

    # GPU parallelism for decode pods
    parallelism:
      tensor: 1      # GPUs per pod for tensor parallelism
      data: 1        # Data-parallel replicas (use replicas above instead)
      dataLocal: 1
      workers: 1

    containers:
      - name: vllm
        # Use an actual vLLM image for production; the default is a simulator
        image: "ghcr.io/llm-d/llm-d-inference-sim:latest"
        # modelCommand options: vllmServe | imageDefault | custom
        modelCommand: vllmServe
        command: []
        args:
          - "--enable-prefix-caching"      # Expose prefix-cache state to the EPP
          - "--disable-log-requests"
        env:
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8200
            name: metrics
            protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        mountModelVolume: true
        volumeMounts:
          - name: metrics-volume
            mountPath: /.config

    volumes:
      - name: metrics-volume
        emptyDir: {}

    initContainers: []

    # ── Decode monitoring ─────────────────────────────────────────────────
    monitoring:
      podmonitor:
        enabled: false          # Set true if Prometheus Operator is installed
        portName: "metrics"
        path: "/metrics"
        interval: "30s"
        labels: {}
        annotations: {}
        relabelings: []
        metricRelabelings: []

  # ── Prefill pods ──────────────────────────────────────────────────────────
  # Set create: true and replicas > 0 to enable prefill/decode disaggregation.
  # For standard (non-disaggregated) serving keep replicas: 0.
  prefill:
    create: true
    replicas: 0     # Set > 0 for PD-disaggregation

    autoscaling:
      enabled: false

    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1

    containers:
      - name: vllm
        image: "ghcr.io/llm-d/llm-d-inference-sim:latest"
        modelCommand: vllmServe
        command: []
        args:
          - "--enable-prefix-caching"
          - "--disable-log-requests"
        env: []
        imagePullPolicy: IfNotPresent
        ports: []
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        mountModelVolume: true
        volumeMounts:
          - name: metrics-volume
            mountPath: /.config

    volumes:
      - name: metrics-volume
        emptyDir: {}

    initContainers: []

    monitoring:
      podmonitor:
        enabled: false
        portName: "metrics"
        path: "/metrics"
        interval: "30s"
        labels: {}
        annotations: {}
        relabelings: []
        metricRelabelings: []

  # ── Distributed tracing (optional) ───────────────────────────────────────
  tracing:
    enabled: false
    otlpEndpoint: "http://otel-collector:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.1"   # 10% sampling for production
    serviceNames:
      vllmDecode: "vllm-decode"
      vllmPrefill: "vllm-prefill"
      routingProxy: "routing-proxy"
    vllm:
      collectDetailedTraces: "all"

  # ── Extra raw Kubernetes objects ──────────────────────────────────────────
  # Rendered and deployed alongside the main chart resources.
  extraObjects: []
